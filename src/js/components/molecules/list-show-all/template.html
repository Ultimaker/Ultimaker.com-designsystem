<section>
    <ul class="list">
        <template v-if="index < limit" v-for="(item, index) in list.listItems.items">
            <component :is="list.listItems.type" :item="item" :key="index" />
        </template>
    </ul>

    <button v-if="!allItemsVisible" @click="showAllItems" class="button--secondary list-section-list__button" >{{ showCount() }}</button>
</section>

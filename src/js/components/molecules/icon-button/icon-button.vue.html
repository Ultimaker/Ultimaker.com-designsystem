<button class="icon-button"
        :type="type"
        :class="buttonClass"
        :aria-label="buttonAriaLabel"
        :disabled="disabled"
        @click="$emit('click')"
        @keyup.enter="$emit('click')">
    <icon class="icon-button__icon" :icon-name="iconName" />
    <span class="icon-button__label" v-if="hasDefaultSlot">
        <slot></slot>
    </span>
</button>

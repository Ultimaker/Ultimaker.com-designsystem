<section class="list-unordered-limit">
    <main>
        <ul>
            <template v-for="(item, index) in listItems.items">
                <template v-if="item.type">
                    <component v-if="index < showLimit() || showLimit() === -1 || showAll" :is="item.type" v-bind="item" :key="index"/>
                    <component v-else :is="item.type" v-bind="item" :key="index" class="list__item--is-hidden"/>
                </template>
            </template>
        </ul>
    </main>
    <footer v-if="showLimit() !== -1">
        <button @click="showHidden">{{ showButtonLabel() }}</button>
    </footer>
</section>

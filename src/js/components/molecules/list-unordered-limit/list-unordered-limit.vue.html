<section class="list-unordered-limit">
    <main>
        <ul>
            <template v-for="item in visibleItems">
                <template v-if="item.type">
                    <component :is="item.type" v-bind="item" />
                </template>
            </template>
        </ul>
    </main>
    <footer v-if="hasExpand">
        <button @click="showHidden">{{ showButtonLabel() }}</button>
    </footer>
</section>

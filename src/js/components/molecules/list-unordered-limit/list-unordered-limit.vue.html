<section class="list-unordered-limit">
    <main v-for="(chunk, index) in chunks"
             v-show="index < visibleRows"
             
             class="flexgrid flexgrid--justify-space-between flexgrid--mobile-xl-row">
        <section key="index"
        v-for="(item, i) in chunk">
            <component :is="item.type"
                       v-bind="item"
                       :key="i"/>
        </section>
    </main>
    <footer>
        <button class="button--secondary">{{ showButtonLabel() }}</button>
    </footer>
</section>

<section class="overview--filter">
    <header>
        <h2 v-if="title" class="overview--filter__title">{{ title }}</h2>
        <h3 v-if="subtitle">{{ subtitle }}</h3>
    </header>
    <main>
        <template v-for="(section, index) in sections">
            <component :is="section.type" v-bind="section" :key="index"/>
        </template>
    </main>
    <footer>
        <cta-block v-if="ctas" :ctas="ctas.ctas" styleContentButton="button" block="overview"/>
    </footer>
</section>

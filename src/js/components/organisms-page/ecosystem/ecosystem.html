<article class="ecosystem">
    <section class="container ecosystem--reset">
        <h2 class="ecosystem__title" v-if="title">{{ title }}</h2>
        <div class="ecosystem__items">
            <card v-for="(item, index) in items" :key="index" :card="item" :block="'ecosystem'"></card>
        </div>
        <div class="ecosystem__video" v-if="videoId">
            <content-link icon="play-video" class="link--large" @click.native="toggleVideo">Play video</content-link>
        </div>
    </section>
    <modal class="modal--video" v-if="showVideo" @close="toggleVideo">
        <youtube-video :video-id="videoId"></youtube-video>
    </modal>
</article>
